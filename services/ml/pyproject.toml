[project]
name = "sentinel-fraud-ml"
description = "Sparkov audits, Task 4 baselines and gated Task 5 development evidence"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kagglehub[pandas-datasets]>=1.0.2,<2",
  "joblib>=1.5,<2",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<0.12"]

[project.optional-dependencies]
worker = ["psycopg[binary]>=3.2,<4", "redis>=5,<7"]

[project.scripts]
fraud-audit = "fraud_ml.sparkov_audit:main"
fraud-baselines = "fraud_ml.cli:baseline_main"
fraud-ensemble-develop = "fraud_ml.ensemble.development:main"
fraud-ensemble-smoke = "fraud_ml.ensemble.bundle:main"
fraud-calibration-develop = "fraud_ml.ensemble.evidence:main"
fraud-policy-options = "fraud_ml.ensemble.options:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_ml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
