dependencies = [
    { name = "joblib" },
    { name = "kagglehub", extra = ["pandas-datasets"] },
    { name = "numpy" },
    { name = "pandas" },
    { name = "scikit-learn" },
    { name = "scipy" },
]

[package.optional-dependencies]
worker = [
    { name = "psycopg", extra = ["binary"] },
    { name = "redis" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "joblib", specifier = ">=1.5,<2" },
    { name = "kagglehub", extras = ["pandas-datasets"], specifier = ">=1.0.2,<2" },
    { name = "numpy", specifier = ">=2.2,<3" },
    { name = "pandas", specifier = ">=2.2,<3" },
    { name = "psycopg", extras = ["binary"], marker = "extra == 'worker'", specifier = ">=3.2,<4" },
    { name = "redis", marker = "extra == 'worker'", specifier = ">=5,<7" },
    { name = "scikit-learn", specifier = ">=1.6,<2" },
    { name = "scipy", specifier = ">=1.15,<2" },
]
provides-extras = ["worker"]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=8.3,<9" },
    { name = "ruff", specifier = ">=0.11,<0.12" },
]

