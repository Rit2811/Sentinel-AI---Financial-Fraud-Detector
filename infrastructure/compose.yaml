name: sentinel-ai

x-runtime-logging: &runtime-logging
  options:
    mode: non-blocking
    max-buffer-size: 1m

services:
  postgres:
    image: postgres:16.4-alpine3.20
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.2.5-alpine3.20
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-sentinel_local_only}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sentinel_local_only}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  api:
    logging: *runtime-logging
    image: sentinel-ai-api:task4
    build:
      context: ../backend
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_local_only}@postgres:5432/${POSTGRES_DB:-sentinel}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_local_only}@postgres:5432/${POSTGRES_DB:-sentinel}
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_local_only}@redis:6379/0
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2}
      RESULT_API_TOKEN: ${RESULT_API_TOKEN:-}
      SCORING_RUN_ID: ${SCORING_RUN_ID:-}
      REVIEW_API_TOKEN: ${REVIEW_API_TOKEN:-}
      REVIEWER_ID: ${REVIEWER_ID:-}
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  publisher:
    logging: *runtime-logging
    image: sentinel-ai-api:task4
    command: ["node", "src/stream/publisher.js"]
    environment: &worker-environment
      POSTGRES_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_local_only}@postgres:5432/${POSTGRES_DB:-sentinel}
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_local_only}@redis:6379/0
      STREAM_NAME: ${STREAM_NAME:-authorization.events.v1}
      STREAM_DEAD_LETTER_NAME: ${STREAM_DEAD_LETTER_NAME:-authorization.events.v1.dead-letter}
      STREAM_CONSUMER_GROUP: ${STREAM_CONSUMER_GROUP:-fraud-proof-v1}
      STREAM_CONSUMER_PURPOSE: ${STREAM_CONSUMER_PURPOSE:-task4-proof-consumer}
      STREAM_BATCH_SIZE: ${STREAM_BATCH_SIZE:-50}
      STREAM_BLOCK_MS: ${STREAM_BLOCK_MS:-2000}
      STREAM_CLAIM_IDLE_MS: ${STREAM_CLAIM_IDLE_MS:-10000}
      STREAM_POLL_MS: ${STREAM_POLL_MS:-500}
      STREAM_MAX_ATTEMPTS: ${STREAM_MAX_ATTEMPTS:-5}
      STREAM_RETENTION: ${STREAM_RETENTION:-10000}
      PUBLISHER_PROFILE: ${PUBLISHER_PROFILE:-0}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    image: sentinel-ai-api:task4
    command: ["node", "src/stream/consumer.js"]
    environment: *worker-environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: sentinel-ai-web:task2
    build:
      context: ../frontend
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-15173}:4173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:4173/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  scoring-worker:
    logging: *runtime-logging
    profiles: [scoring]
    image: sentinel-ai-scoring-worker:task6
    build:
      context: ../services/ml
    command:
      - --bundle
      - /model
      - --bundle-sha256
      - ${SCORING_BUNDLE_SHA256:-unset}
      - --run-id
      - ${SCORING_RUN_ID:-unset}
      - --gate-report
      - /gates/report.json
      - --gate-report-sha256
      - ${SCORING_GATE_REPORT_SHA256:-unset}
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_local_only}@postgres:5432/${POSTGRES_DB:-sentinel}
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_local_only}@redis:6379/0
      SCORING_STREAM: ${STREAM_NAME:-authorization.events.v1}
      SCORING_PROFILE: ${SCORING_PROFILE:-0}
    volumes:
      - ${SCORING_BUNDLE_DIR:-../services/ml/artifacts/frozen/random-forest/20261002T075558874195Z}:/model:ro
      - ${SCORING_GATE_DIR:-../services/ml/reports/final-test}:/gates:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure:3

volumes:
  postgres_data:
    name: sentinel-ai-postgres-data
  redis_data:
    name: sentinel-ai-redis-data
